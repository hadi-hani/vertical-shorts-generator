services:
  shorts-video:
    build: .
    ports:
      - "8283:8283"
    env_file: .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    # Persist the whole data directory: SQLite DB (data/app.db), outputs,
    # work files and backups all live under ./data so they survive
    # container recreation/upgrades.
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8283/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
