<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>500 — خطأ في الخادم</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0f1a;
      color: #e8eaf2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      background: #171a2b;
      border: 1px solid #262a40;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      max-width: 440px;
      width: 100%;
    }
    h1 { font-size: 72px; font-weight: 800; color: #ff7a7a; line-height: 1; }
    p { color: #8b90a5; font-size: 15px; margin: 16px 0 24px; }
    a {
      display: inline-block;
      background: #62c8ff;
      color: #0d0f1a;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>500</h1>
    <p>حدث خطأ غير متوقع في الخادم. حاول مرة أخرى بعد قليل.</p>
    <a href="/">العودة إلى الرئيسية</a>
  </div>
</body>
</html>
