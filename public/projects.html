<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مشاريعي — Shorts Captions</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0f1a;
      color: #e8eaf2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    .wrap { width: 100%; max-width: 640px; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { color: #62c8ff; }
    header p { color: #8b90a5; font-size: 13px; margin-top: 6px; }
    .topnav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .topnav a { color: #62c8ff; font-weight: 600; text-decoration: none; }
    .topnav .spacer { flex: 1; }
    .authbar { display: flex; align-items: center; gap: 12px; font-size: 13px; }
    .authbar .email { color: #a7adc6; }
    .authbar button {
      flex: 0 0 auto;
      border: 1px solid #2a2f4a;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      background: #0f1220;
      color: #ff7d7d;
      cursor: pointer;
    }
    .card {
      background: #171a2b;
      border: 1px solid #262a40;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .badge {
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
    }
    .badge.queued { background: #2a2f4a; color: #c6cbe0; }
    .badge.processing { background: #24304d; color: #62c8ff; }
    .badge.completed { background: #14301f; color: #62e0a0; }
    .badge.failed { background: #3a1b1b; color: #ff7d7d; }
    .badge.interrupted { background: #33291a; color: #f0c26a; }
    .title { font-size: 15px; font-weight: 600; line-height: 1.6; word-break: break-word; }
    .meta { font-size: 12px; color: #6f7490; margin-top: 4px; }
    .error-line { color: #ff7d7d; font-size: 12px; margin-top: 8px; word-break: break-word; }
    .dl-row { display: flex; gap: 10px; margin-top: 12px; }
    .dl {
      flex: 1;
      text-align: center;
      padding: 9px;
      color: #62c8ff;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      background: #0f1220;
      border: 1px solid #2a2f4a;
      border-radius: 10px;
    }
    .dl:hover { border-color: #62c8ff; }
    .delete {
      flex: 0 0 auto;
      border: 1px solid #4a2626;
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      background: #0f1220;
      color: #ff7d7d;
      cursor: pointer;
    }
    .delete:hover:not(:disabled) { border-color: #ff7d7d; }
    .delete:disabled { opacity: 0.5; cursor: not-allowed; }
    .empty {
      text-align: center;
      color: #8b90a5;
      font-size: 14px;
      padding: 48px 16px;
      border: 1px dashed #2a2f4a;
      border-radius: 16px;
      line-height: 2;
    }
    .empty a { color: #62c8ff; font-weight: 600; text-decoration: none; }
    .foot { text-align: center; font-size: 12px; color: #6f7490; margin-top: 20px; }
    .foot a { color: #62c8ff; text-decoration: none; font-weight: 600; }
    .hidden { display: none; }
    .error { color: #ff7d7d; font-size: 13px; text-align: center; margin-top: 20px; }
    .quota { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .quota .q-info { font-size: 13px; color: #a7adc6; line-height: 1.8; }
    .quota .q-info b { color: #e8eaf2; }
    .quota .q-resets { font-size: 12px; color: #6f7490; }
    .quota .q-bar { flex: 1; max-width: 260px; }
    .quota .bar { height: 8px; background: #0f1220; border: 1px solid #2a2f4a; border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .quota .bar > div { height: 100%; background: linear-gradient(90deg, #62c8ff, #7e6bff); transition: width 0.4s; }
    .quota .bar.warn > div { background: #f0c26a; }
    .quota .bar.danger > div { background: #ff7d7d; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>مشاريعي <span>Shorts Captions</span></h1>
      <p>جميع مشاريعك السابقة — فيديوهات وترجمات جاهزة للتنزيل</p>
    </header>

    <div class="topnav">
      <a href="/">← الأداة</a>
      <span class="spacer"></span>
      <nav class="authbar hidden" id="authBar"></nav>
    </div>

    <div class="card quota hidden" id="quotaCard"></div>

    <main id="projects"></main>
    <p class="foot">
      <a href="/">إنشاء مقطع جديد</a>
    </p>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/projects.js"></script>
</body>
</html>
