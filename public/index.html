<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shorts Video MVP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0f1a;
      color: #e8eaf2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    .wrap { width: 100%; max-width: 560px; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { color: #62c8ff; }
    header p { color: #8b90a5; font-size: 13px; margin-top: 6px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab {
      flex: 1;
      background: #171a2b;
      border: 1px solid #262a40;
      color: #a7adc6;
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .tab.active { background: #62c8ff; color: #08131c; border-color: #62c8ff; }
    .tab.disabled { opacity: 0.5; cursor: not-allowed; }
    .tab .badge {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
      opacity: 0.75;
    }
    .tool-panel { margin-bottom: 16px; }
    .card {
      background: #171a2b;
      border: 1px solid #262a40;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 12px; font-weight: 600; color: #a7adc6; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.6px; }
    input, textarea, select {
      width: 100%;
      background: #0f1220;
      border: 1px solid #2a2f4a;
      border-radius: 10px;
      color: #e8eaf2;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus { border-color: #62c8ff; }
    textarea { min-height: 110px; resize: vertical; font-family: inherit; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .btns { display: flex; gap: 12px; margin-top: 18px; }
    .segmented { display: flex; gap: 8px; background: #0f1220; border: 1px solid #2a2f4a; border-radius: 10px; padding: 4px; }
    .seg {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      background: transparent;
      color: #8b90a5;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .seg.active { background: #62c8ff; color: #08131c; }
    .hidden { display: none; }
    button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .primary { background: #62c8ff; color: #08131c; }
    .secondary { background: #262a40; color: #e8eaf2; }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    .script-row { display: flex; gap: 8px; align-items: center; }
    .script-row button { flex: 0 0 auto; padding: 12px 18px; margin-top: 0; }
    .hint { font-size: 12px; color: #6f7490; margin-top: 8px; }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #e8eaf2;
      text-transform: none;
      letter-spacing: 0;
      margin-top: 16px;
    }
    .check input { width: auto; accent-color: #62c8ff; margin: 0; }
    .check .hint { margin: 0; }
    .status { margin-top: 16px; }
    .progress {
      height: 8px;
      background: #0f1220;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 12px;
    }
    .progress > div {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #62c8ff, #7e6bff);
      transition: width 0.4s;
    }
    #sub-statusText { font-size: 13px; color: #a7adc6; margin-top: 10px; }
    .stage { font-weight: 600; color: #e8eaf2; }
    .error { color: #ff7d7d; font-size: 13px; margin-top: 10px; word-break: break-word; }
    .success { color: #62e0a0; font-size: 13px; margin-top: 10px; }
    video {
      width: 100%;
      max-height: 520px;
      border-radius: 12px;
      background: #000;
      display: block;
    }
    .dl {
      display: block;
      text-align: center;
      margin-top: 12px;
      color: #62c8ff;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
    }
    .dl-row { display: flex; gap: 10px; margin-top: 12px; }
    .dl-row .dl { flex: 1; margin-top: 0; padding: 10px; background: #0f1220; border: 1px solid #2a2f4a; border-radius: 10px; }
    .meta { text-align: center; }
    .soon { text-align: center; padding: 40px 20px; }
    .soon-badge {
      display: inline-block;
      background: #2a2f4a;
      color: #a7adc6;
      border-radius: 99px;
      padding: 4px 14px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .soon-title { font-size: 18px; margin: 14px 0 8px; }
    .soon p { max-width: 380px; margin: 0 auto; }
    .jobs { font-size: 12px; color: #6f7490; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Shorts <span>Video</span> MVP</h1>
      <p>Turn a one-line idea into a 9:16 short video with voice-over and animated subtitles</p>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tool="subtitles" type="button">Subtitles &amp; Captions</button>
      <button class="tab disabled" data-tool="footage" type="button">Video &amp; Footage Builder <span class="badge">Coming Soon</span></button>
    </nav>

    <main>
      <section class="tool-panel" id="tool-subtitles"></section>
      <section class="tool-panel hidden" id="tool-footage"></section>
    </main>

    <p class="jobs" id="jobCount"></p>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/tools/subtitles.js"></script>
  <script src="/js/tools/footage.js"></script>
</body>
</html>
